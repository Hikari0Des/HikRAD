# HikRAD CI (Phase 1, Agent A — NFR-8). Every job guards on its inputs
# existing so the pipeline stays green while the parallel Phase-1 agents
# (backend module: D, frontend: E/F, harness: B) merge in any order.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Go vet / build / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: hikrad
          POSTGRES_PASSWORD: hikrad-ci
          POSTGRES_DB: hikrad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikrad -d hikrad_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      # Integration-style tests may use these; unit tests must not require them.
      HIKRAD_TEST_DB_URL: postgres://hikrad:hikrad-ci@localhost:5432/hikrad_test?sslmode=disable
      HIKRAD_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Detect Go module
        id: detect
        run: |
          if [ -f backend/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/go.mod not present yet (Agent D) — skipping Go job"
          fi
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: go vet ./...
      - name: go build
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: go build ./...
      - name: go test (race)
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        # -p 1: see the Makefile `test` target's comment — every package shares
        # one real Postgres/Redis here, and whole-table aggregate reconciliation
        # tests need packages serialized to stay deterministic.
        run: go test -race -p 1 ./...

  frontend:
    name: Frontend lint / build / i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend workspaces
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not present yet (Agents E/F) — skipping frontend job"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --workspaces --if-present
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build --workspaces --if-present
      - name: i18n check (no hardcoded user-visible strings — contract C8, CI-fatal)
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run i18n:check

  scripts:
    name: Ops scripts self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/gen-env.sh scripts/gen-env.test.sh scripts/install.sh scripts/hikrad \
                  scripts/migrate-to-native.sh scripts/build-release-bundle.sh scripts/dev-run.sh \
                  scripts/uninstall.sh scripts/quick-install.sh scripts/lint-release-manifest.sh \
                  deploy/routeros/entrypoint.sh deploy/routeros/build.sh \
                  backend/test/harness/run-smoke.sh
      - name: gen-env self-test (unique valid secrets twice)
        run: bash scripts/gen-env.test.sh
      # v4-2 (FR-118): install.sh's idempotency contract (gate item 3) —
      # HIKRAD_ROOT_OVERRIDE sandboxes every frozen path under $RUNNER_TEMP
      # so this never touches real system state; HIKRAD_SKIP_PACKAGES skips
      # apt-get/postgres/freeradius provisioning (that's exercised for real
      # in the harness-smoke job below via native freeradius) so this stays
      # a fast, network-independent check of the actual idempotency logic:
      # directory/user creation, hikrad.env write-once, port persistence.
      - name: install.sh idempotency (sandboxed root, no packages installed)
        run: |
          export HIKRAD_ROOT_OVERRIDE="$RUNNER_TEMP/hikrad-root"
          export HIKRAD_SKIP_OS_CHECK=1 HIKRAD_SKIP_PACKAGES=1 HIKRAD_HTTP_PORT=8080
          sudo -E bash scripts/install.sh --no-start
          test -f "$HIKRAD_ROOT_OVERRIDE/etc/hikrad/hikrad.env"
          before="$(sha256sum "$HIKRAD_ROOT_OVERRIDE/etc/hikrad/hikrad.env")"
          before_meta="$(cat "$HIKRAD_ROOT_OVERRIDE/etc/hikrad/install.meta")"
          # Re-run with a DIFFERENT HIKRAD_HTTP_PORT to prove install.meta's
          # already-recorded port wins over the env var, not the other way
          # around (gate item 3/5: the chosen port is never changed by a
          # re-run once set).
          export HIKRAD_HTTP_PORT=9090
          sudo -E bash scripts/install.sh --no-start
          after="$(sha256sum "$HIKRAD_ROOT_OVERRIDE/etc/hikrad/hikrad.env")"
          after_meta="$(cat "$HIKRAD_ROOT_OVERRIDE/etc/hikrad/install.meta")"
          [ "$before" = "$after" ] || { echo "hikrad.env was modified on re-run"; exit 1; }
          [ "$before_meta" = "$after_meta" ] || { echo "install.meta (port/delivery mode) changed on re-run despite a different HIKRAD_HTTP_PORT"; exit 1; }

  release-manifest:
    name: Release bundle manifest audit (FR-126)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Assemble a rehearsal bundle
        run: bash scripts/build-release-bundle.sh v0.0.0-ci /tmp/hikrad-bundle.tar
      - name: Extract and audit (deny-list is a frozen contract — loosening it needs an amendment, never a local exception)
        run: |
          mkdir -p /tmp/hikrad-bundle-stage
          tar -xf /tmp/hikrad-bundle.tar -C /tmp/hikrad-bundle-stage
          bash scripts/lint-release-manifest.sh /tmp/hikrad-bundle-stage

  secret-scan:
    name: Secret scanning (gitleaks, FR-127)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  harness-smoke:
    name: RADIUS harness smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: hikrad
          POSTGRES_PASSWORD: hikrad-ci
          POSTGRES_DB: hikrad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikrad -d hikrad_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      HIKRAD_DB_URL: postgres://hikrad:hikrad-ci@127.0.0.1:5432/hikrad_test?sslmode=disable
      HIKRAD_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Detect harness target
        id: detect
        run: |
          if [ -f backend/Makefile ] && make -C backend -n test-harness-smoke >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend test-harness-smoke target not present yet — skipping"
          fi
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: backend/go.mod
      - name: Install FreeRADIUS (native, no Docker — v4-2/FR-118)
        if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq freeradius
      - name: Run harness smoke (simulated MikroTik NAS → native FreeRADIUS → hikrad-api authorize)
        if: steps.detect.outputs.present == 'true'
        run: make -C backend test-harness-smoke
