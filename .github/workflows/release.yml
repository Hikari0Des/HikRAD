# HikRAD release pipeline (v2 phase 5, FR-81/C3; reworked off Docker images
# in v4-2/FR-119 — the Linux bundle carries binaries, not images; the ONE
# remaining docker build in this repo is deploy/routeros/build.sh, used
# purely as a build tool for the single RouterOS container image, Decision
# 58 — no registry push, no GHCR, nothing installed on a customer server).
# Separate from ci.yml deliberately: this job builds+publishes a signed,
# downloadable artifact, so it must never run on an ordinary push/PR — only
# on a version tag, pushed deliberately by whoever is cutting a release
# (see docs/ops/release-checklist.md).
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, sign and publish a release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach the bundle as a GitHub Release asset
    env:
      # The `secrets` context is not allowed in a step-level `if:` — using it
      # there made GitHub reject this whole file ("workflow file issue") on
      # every push, so no tag could ever run it. Job-level env may read
      # secrets; the steps below gate on this boolean instead.
      HAS_MIRROR_TOKEN: ${{ secrets.HIKRAD_RELEASES_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive version from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode release signing key
        env:
          HIKRAD_RELEASE_SIGNING_KEY: ${{ secrets.HIKRAD_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$HIKRAD_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::HIKRAD_RELEASE_SIGNING_KEY secret is not set — falling back to the checked-in DEV signing key (scripts/release-signing/dev-release-key.pem). Fine for a rehearsal tag, NOT fine for a real customer shipment (see scripts/release-signing/README.md before the first commercial release)."
          else
            echo "$HIKRAD_RELEASE_SIGNING_KEY" | base64 -d > /tmp/release-signing-key.pem
            echo "RELEASE_SIGNING_KEY_FILE=/tmp/release-signing-key.pem" >> "$GITHUB_ENV"
          fi

      - name: Build binaries, frontend, and assemble the signed Linux bundle
        env:
          HIKRAD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build-release-bundle.sh "$HIKRAD_VERSION" "hikrad-${HIKRAD_VERSION}.tar"

      - name: Re-extract and verify the packed tar (proves the packed artifact itself, not just the staging dir build-release-bundle.sh already self-checked)
        env:
          HIKRAD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          d=$(mktemp -d)
          tar -xf "hikrad-${HIKRAD_VERSION}.tar" -C "$d"
          bash scripts/verify-bundle.sh "$d"

      # Decision 58: the ONE remaining image build in this repo, for the ONE
      # device target (RouterOS's own container feature) that has no other
      # way to run third-party software. Not pushed anywhere — distributed
      # as a downloadable .tar, imported directly on the router (NFR-7).
      - name: Build the RouterOS container image (amd64 + arm64)
        env:
          HIKRAD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash deploy/routeros/build.sh "$HIKRAD_VERSION" "hikrad-routeros-${HIKRAD_VERSION}-amd64.tar" amd64
          bash deploy/routeros/build.sh "$HIKRAD_VERSION" "hikrad-routeros-${HIKRAD_VERSION}-arm64.tar" arm64

      - name: Publish the release assets (internal record, private repo)
        env:
          HIKRAD_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$HIKRAD_VERSION" \
            "hikrad-${HIKRAD_VERSION}.tar" \
            "hikrad-routeros-${HIKRAD_VERSION}-amd64.tar" \
            "hikrad-routeros-${HIKRAD_VERSION}-arm64.tar" \
            --title "HikRAD $HIKRAD_VERSION" \
            --generate-notes

      # PRD Decision 56 (amends FR-83.1): customer-facing distribution moves
      # to a SEPARATE, intentionally public repo (Hikari0Des/hikrad-releases)
      # containing zero HikRAD source — only signed bundle assets and the
      # thin curl-installer wrapper (scripts/quick-install.sh). The source
      # repo above stays private and ungranted to customers, unchanged.
      # HIKRAD_RELEASES_REPO_TOKEN is a fine-grained PAT scoped ONLY to that
      # public repo (contents:write) — deliberately unable to touch this
      # private source repo even if it ever leaked. Both steps below no-op
      # with a warning (never fail the release) if that one-time setup
      # (create the repo, mint the token, add the secret) hasn't happened
      # yet — same "degrade, don't block a rehearsal tag" posture as the
      # release-signing-key fallback above.
      - name: Publish the release assets to the public releases mirror (customer distribution)
        if: env.HAS_MIRROR_TOKEN == 'true'
        continue-on-error: true   # never let a mirror hiccup fail the already-published internal release
        env:
          HIKRAD_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.HIKRAD_RELEASES_REPO_TOKEN }}
        run: |
          gh release create "$HIKRAD_VERSION" \
            "hikrad-${HIKRAD_VERSION}.tar" \
            "hikrad-routeros-${HIKRAD_VERSION}-amd64.tar" \
            "hikrad-routeros-${HIKRAD_VERSION}-arm64.tar" \
            --repo "Hikari0Des/hikrad-releases" \
            --title "HikRAD $HIKRAD_VERSION" \
            --generate-notes

      - name: Sync the curl-installer wrapper to the public releases mirror
        if: env.HAS_MIRROR_TOKEN == 'true'
        continue-on-error: true   # same reasoning as the step above
        env:
          HIKRAD_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.HIKRAD_RELEASES_REPO_TOKEN }}
        run: |
          d="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Hikari0Des/hikrad-releases.git" "$d"
          cp scripts/quick-install.sh "$d/install.sh"
          if ! git -C "$d" diff --quiet -- install.sh; then
            git -C "$d" config user.name "HikRAD Release Bot"
            git -C "$d" config user.email "release-bot@users.noreply.github.com"
            git -C "$d" add install.sh
            git -C "$d" commit -m "Sync installer wrapper from HikRAD ${HIKRAD_VERSION}"
            git -C "$d" push
          else
            echo "install.sh unchanged — nothing to sync."
          fi

      - name: Warn if the public releases mirror isn't set up yet
        if: env.HAS_MIRROR_TOKEN != 'true'
        run: |
          echo "::warning::HIKRAD_RELEASES_REPO_TOKEN secret is not set — skipped publishing to the public Hikari0Des/hikrad-releases mirror and syncing the curl-installer wrapper. The bundle is still published above as a Release asset on THIS (should be private) repo only. See docs/ops/release-checklist.md before the first real customer shipment."
